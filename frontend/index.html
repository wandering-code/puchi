<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: al abrirse el teclado, el
         viewport de LAYOUT se encoge hasta donde empieza el teclado. Así
         #root (height:100%) termina justo ahí y no queda ninguna franja por
         debajo — esa zona que iOS destapa al subir la página queda fuera del
         documento y NINGÚN elemento puede pintarla (probado: ni el fondo de
         html, ni una capa a pantalla completa dentro de #root).
         Se probó en su día y se descartó, pero en aquel momento convivía con
         useLockViewportToKeyboard, que movía #root en sentido contrario al
         paneo del navegador: los dos peleaban y no se podía saber cuál de los
         dos fallaba. Esa compensación ya no existe (ver el comentario largo
         de main.jsx, issue #13), así que esto vuelve a estar sobre la mesa —
         ahora es el navegador el único que decide, que es lo que se busca.
         Con el layout ya encogido, --kb vale 0 solo y el padding que aparta
         el contenido no llega ni a aplicarse; se queda como red de seguridad
         para donde el navegador no haga caso de esto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Puchi</title>
    <link rel="icon" type="image/svg+xml" href="/paw-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://meet.jit.si/external_api.js" async></script>
  </head>
  <body>
    <!-- Filtros SVG reutilizables — no ocupan espacio visual -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <!-- Unsharp mask: sharpening para imágenes AI que salen suaves -->
        <filter id="sharpen" color-interpolation-filters="linearRGB">
          <feConvolveMatrix
            order="3"
            kernelMatrix="0 -0.5 0  -0.5 3 -0.5  0 -0.5 0"
            divisor="1"
            bias="0"
            preserveAlpha="true"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
